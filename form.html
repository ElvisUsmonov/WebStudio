<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Form</title>
</head>
<body class="body-form">
    <div class="container-wrap">
        <div class="forma-walpers">
            <div class="forma">
            <div class="contain">
                <div class="switch">
                    <input class="switch-input" type="checkbox" id="switch">
                    <label class="switch-label" for="switch">
                        <span>Login</span>
                        <span>Register</span>
                    </label>
                </div>
                <div class="log-in">
                    <h2>Login</h2>
                    <input class="e-mail" type="email" placeholder="E-mail">
                    <input class="password" type="password" placeholder="Password">
                    <div class="remember-checkbox">
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Remember Me</label>
                    <a href="#" class="forgot-password">Forgot  password?</a>
                    </div>
                    <button class="forma-btn">Login</button>
                    <div class="forma-question">
                        <p class="create-account">Don't have an account yet?</p>
                        <a href="#" class="registration">Register</a>
                    </div>
                    <p class="forma-or-log">Or login</p>
                    <div class="forma-socials">
                        <ul>
                            <li class="form-social-item">
                                <a href="#">
                                    <svg class="form-item">
                                        <use href="images/sprites.svg#instagram"></use>
                                    </svg>
                                </a>
                            </li>
                            <li class="form-social-item">
                                <a href="#">
                                    <svg class="form-item">
                                        <use href="images/sprites.svg#facebook"></use>
                                    </svg>
                                </a>
                            </li>
                            <li class="form-social-item">
                                <a href="#">
                                    <svg class="form-item">
                                        <use href="images/sprites.svg#linkedin"></use>
                                    </svg>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
